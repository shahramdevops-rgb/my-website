# Development overrides, merged automatically by `docker compose up`.
# Ports bind to 127.0.0.1 only, so the app and DB are not reachable from other machines on your network.
services:
  caddy:
    volumes:
      - ./deploy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    ports:
      # http://localhost:8080 = the whole site: Next.js pages and /api/* on one origin.
      - "127.0.0.1:8080:80"

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Site__BaseUrl: http://localhost:8080
    # No published port: the API is reached only through Caddy (or at :5080 when run on the host).

  db:
    ports:
      # Lets the app running on the host (`dotnet watch`) and DB tools reach PostgreSQL at localhost:5433.
      # Host port 5433 (not 5432) so it never clashes with another local PostgreSQL; inside Docker it's still 5432.
      - "127.0.0.1:5433:5432"
