# Production overrides, merged on top of compose.yaml (compose.override.yaml is NOT loaded when -f is given):
#   docker compose -f compose.yaml -f compose.prod.yaml pull
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
# Values come from the git-ignored .env next to this file (template: .env.example, "Production" section).
# Differences from dev: images are pulled from GHCR (never built on the server), there is no Caddy in this stack —
# the server's shared edge proxy (deploy/edge, ADR-028) terminates HTTPS and reaches frontend/api on loopback ports —
# every service restarts on its own and has CPU/memory limits, and data lives in the named volumes
# pgdata/uploads/dpkeys.

# Container logs are capped (3 x 10 MB per service), so a chatty service can't fill the server's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The server is shared with another production app (deploy/SHARED-SERVER.md), so this stack may never starve it:
# each service gets at most one of the two cores and a memory cap, and oom_score_adj makes the kernel's OOM killer
# pick this site's processes before the other app's (default 0) if the machine runs out of memory anyway.
# Starting values — compare with `docker stats` on the server and adjust. .NET and Node size their heaps from the
# container limit; PostgreSQL's defaults (shared_buffers 128 MB) fit inside it.
x-limits: &limits
  cpus: 1.0
  mem_limit: 384m
  oom_score_adj: 500
  # A fork bomb (or a runaway thread pool) stops at 256 processes/threads in this container instead of exhausting
  # the kernel's process table, which the gym's containers share. .NET and Node use a few dozen threads.
  pids_limit: 256

# Hardening (P4-T7, deploy/SHARED-SERVER.md §6): if someone ever gets code running inside one of these containers,
# limit what that code can do to the server and to the gym next to it. All of them share the host's kernel, so the
# aim is to leave as little kernel surface and privilege as possible.
# - cap_drop ALL: none of Linux's root powers (changing file owners, raw sockets, binding ports < 1024, ...). The
#   API and Next.js already run as non-root users and need none; the db adds back the few its entrypoint needs.
# - no-new-privileges: a setuid binary (e.g. su) can't raise a process's privileges, even if one is found in the image.
# - read_only: the container's own filesystem can't be changed, so an attacker can't drop tools or modify the app's
#   files; only the named volumes and small in-memory tmpfs mounts are writable (they count towards mem_limit).
# Docker's default seccomp profile (which blocks ~44 dangerous syscalls) stays on: it is never disabled here.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true

# Fixed address range of the stack's network. The edge reaches frontend/api through their published loopback ports,
# so Docker hands those connections to the containers from this network's gateway (172.30.0.1): the API trusts
# forwarded headers from this network only (ReverseProxy:TrustedNetworks, P4-T2). Docker would otherwise pick a
# different range on each server. If it clashes with a network that already exists on the host, `up` fails with a
# clear error: pick another /24 here.
x-subnet: &subnet 172.30.0.0/24

services:
  frontend:
    # GHCR image built by the release workflow (P4-T3); IMAGE_TAG is a release tag, never "latest".
    image: ${IMAGE_REGISTRY:-ghcr.io/shahramdevops-rgb}/personalsite-frontend:${IMAGE_TAG:?IMAGE_TAG is not set (release tag, e.g. v0.1.0)}
    # `!reset` drops the dev `build:` from compose.yaml: the server never builds, it only pulls.
    build: !reset null
    restart: unless-stopped
    logging: *logging
    <<: [*limits, *hardening]
    tmpfs:
      # Next.js's data cache (cached API fetches, ADR-025) and image cache; uid 1000 = the image's "node" user.
      # In memory, so it starts empty after a restart, like a fresh deploy.
      - /app/.next/cache:uid=1000,gid=1000,mode=0700,size=64m
      - /tmp:size=16m
    ports:
      # Loopback only: reachable by the edge proxy on this machine, never from outside (Docker's published ports
      # bypass ufw, so a 0.0.0.0 binding here would be open to the internet). The edge finds the port with
      # `docker compose port` (deploy.sh), so changing it is an .env change only.
      - "127.0.0.1:${FRONTEND_HOST_PORT:-13000}:3000"

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io/shahramdevops-rgb}/personalsite-api:${IMAGE_TAG:?IMAGE_TAG is not set (release tag, e.g. v0.1.0)}
    build: !reset null
    restart: unless-stopped
    logging: *logging
    <<: [*limits, *hardening]
    tmpfs:
      # .NET's temp files and diagnostic sockets (dotnet-counters/-trace attach through /tmp).
      - /tmp:size=16m
    networks:
      # default: published port, the edge's forwarded headers and the frontend's calls (http://api:8080).
      # backend: the database. An internal network is never a container's gateway, so connections to the published
      # port keep arriving from 172.30.0.1, the trusted proxy address (ReverseProxy:TrustedNetworks).
      - default
      - backend
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18080}:8080"
    # The API's own settings (Site__Social__*, FeatureManagement__*, later Admin__*, ...) come from .env.
    # A file instead of a list here, because keys like FeatureManagement__Ai.Mcp can't be ${...} variables.
    # Optional so `docker compose ... config` can validate with another --env-file (e.g. in CI); a real deploy
    # without .env stops anyway, because POSTGRES_PASSWORD, SITE_HOST and IMAGE_TAG have no defaults.
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # One source for the hostname: the canonical URL is built from SITE_HOST (architecture.md §9.1).
      Site__BaseUrl: https://${SITE_HOST:?SITE_HOST is not set}
      # The edge's X-Forwarded-For/-Proto are believed only from this network (client IP, https scheme → HSTS).
      ReverseProxy__TrustedNetworks__0: *subnet
    volumes:
      # Mount paths are fixed by the image (src/PersonalSite.Api; Dockerfile creates them owned by the app user).
      # uploads: admin-uploaded files (P6). dpkeys: Data Protection keys, so restarts keep cookies valid (P4-T2).
      - uploads:/app/data/uploads
      - dpkeys:/app/data/dp-keys

  db:
    restart: unless-stopped
    logging: *logging
    <<: [*limits, *hardening]
    # The official image's entrypoint starts as root, fixes the data directory's owner and switches to the
    # "postgres" user (su-exec): it needs these powers back, and nothing else. PostgreSQL itself runs unprivileged.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      # The server's unix socket (pg_dump/psql in backup.sh connect through it) and temp files.
      - /var/run/postgresql:uid=70,gid=70,mode=2777,size=1m
      - /tmp:size=64m
    # Only on the internal backend network: the frontend can't reach PostgreSQL at all, and the database has no route
    # to the internet or the host. No ports either (the dev override's 5433 is not loaded).
    networks: [backend]

networks:
  default:
    ipam:
      config:
        - subnet: *subnet
  # api ↔ db only. internal: Docker gives it no gateway, so nothing on it can open connections outside it.
  backend:
    internal: true

volumes:
  uploads:
  dpkeys:
