# Shared service definitions for every environment.
#   Dev:  docker compose up --build            (auto-merges compose.override.yaml, which adds Caddy on :8080)
#   Prod: docker compose -f compose.yaml -f compose.prod.yaml up -d   (images from GHCR, behind the shared edge proxy)
# Values like ${POSTGRES_PASSWORD} come from the git-ignored .env file (template: .env.example).
name: personalsite

# One origin for both apps comes from a Caddy in front of them: in dev the `caddy` service of compose.override.yaml
# (deploy/Caddyfile.dev), in production the server's shared edge proxy (deploy/edge, deploy/personalsite.caddy).
services:
  frontend:
    build:
      context: ./frontend
    image: personalsite-frontend:dev
    environment:
      # Server-side calls go straight to the API container over the compose network, not through Caddy.
      API_INTERNAL_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    # Healthcheck is defined in frontend/Dockerfile (HEALTHCHECK).

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: personalsite-api:dev
    environment:
      # Built from the same .env values as the db service; "db" is the service name on the compose network.
      # GSS Encryption Mode=Disable: Npgsql would first try Kerberos encryption, whose native library the chiseled
      # image doesn't have ("Cannot load library libgssapi_krb5.so.2" on every new connection). Not used here.
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-site};Username=${POSTGRES_USER:-site};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
    depends_on:
      db:
        condition: service_healthy
    # Healthcheck itself is defined in the Dockerfile (HEALTHCHECK), so it travels with the image.

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-site}
      POSTGRES_USER: ${POSTGRES_USER:-site}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  # Named volume: lives outside the container, survives `docker compose down`.
  # Only `docker compose down -v` deletes it.
  pgdata:
