# CI: every push and pull request must build, be formatted, and pass all tests — two jobs in parallel:
# the .NET API (incl. Testcontainers) and the Next.js front-end.
# Image build + push to GHCR is a separate workflow (release.yml), which runs this one first.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Called by release.yml before it builds images (a tag push doesn't trigger the branch rule above).
  workflow_call:

# A newer push to the same branch cancels the run that is still going: only the latest commit matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the code.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & test
    # ubuntu runners ship with Docker, which Testcontainers needs for the integration tests.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Same SDK as on Shahram's machine: the version comes from global.json.
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          # All package versions live in Directory.Packages.props, so it is the cache key.
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The build regenerates openapi/v1.json (ADR-026). Any difference from the committed file means an endpoint
      # or DTO changed without its new contract being committed, so the front-end types would be stale.
      - name: Check OpenAPI document is current
        run: |
          if [ -n "$(git status --porcelain -- openapi)" ]; then
            echo "::error file=openapi/v1.json::openapi/v1.json is stale. Run 'dotnet build' and commit the regenerated file."
            git --no-pager diff -- openapi
            exit 1
          fi

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      # Known vulnerabilities (GitHub Advisory Database via nuget.org) in any package, direct or transitive. The
      # command itself always exits 0, so its report is searched. Runs on every push, so an advisory published
      # after a package was added fails the next build and the next release (release.yml runs this workflow).
      - name: Check for vulnerable NuGet packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see the report above). Update them in Directory.Packages.props."
            exit 1
          fi

      - name: Test
        run: dotnet test --no-build --configuration Release

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # Next.js sends anonymous usage data by default; this project sends nothing it doesn't have to.
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # The exact pnpm version comes from "packageManager" in this file (same as Corepack locally).
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile: install exactly what pnpm-lock.yaml says, and fail if package.json disagrees with it.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Known vulnerabilities in what ships in the image (--prod: dependencies, not devDependencies), high or
      # critical only, so a moderate advisory in a deep dependency doesn't block every push; Dependabot alerts
      # report the rest. Exits non-zero on a finding.
      - name: Check for vulnerable npm packages
        run: pnpm audit --prod --audit-level high

      # The TS types come from openapi/v1.json (whose match with the C# code the .NET job checks). Stale types
      # would let the front-end compile against a contract the API no longer has.
      - name: Check API types are current
        run: |
          pnpm gen:api
          if [ -n "$(git status --porcelain -- src/lib/api/schema.d.ts)" ]; then
            echo "::error file=frontend/src/lib/api/schema.d.ts::API types are stale. Run 'pnpm gen:api' and commit the result."
            git --no-pager diff -- src/lib/api/schema.d.ts
            exit 1
          fi

      - name: Lint & format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Browser tests against the production build (and the typed mock API): language routing, and the CSP
      # check on every route — any CSP violation fails the job (ADR-025).
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm e2e
